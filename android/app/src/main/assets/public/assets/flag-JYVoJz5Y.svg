<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="100%" height="100%">
  <defs>
    <!-- Metallic gradient for flagpole -->
    <linearGradient id="pole-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78716c" />
      <stop offset="35%" stop-color="#d6d3d1" />
      <stop offset="50%" stop-color="#fafaf9" />
      <stop offset="65%" stop-color="#a8a29e" />
      <stop offset="100%" stop-color="#44403c" />
    </linearGradient>

    <!-- Metallic gradient for finial ball -->
    <radialGradient id="ball-grad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fafaf9" />
      <stop offset="40%" stop-color="#d6d3d1" />
      <stop offset="80%" stop-color="#78716c" />
      <stop offset="100%" stop-color="#44403c" />
    </radialGradient>

    <!-- Shading overlay for 3D waving effect -->
    <linearGradient id="wave-shading" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.3" />
      <stop offset="15%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="30%" stop-color="#000000" stop-opacity="0.25" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="60%" stop-color="#000000" stop-opacity="0.3" />
      <stop offset="75%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="90%" stop-color="#000000" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>

    <!-- Clip path to keep the waves clean -->
    <clipPath id="flag-clip">
      <!-- A beautifully styled waving flag outline -->
      <path d="M 30,25 
               Q 70,22 110,25 
               T 190,25 
               Q 205,25 210,27
               L 210,127
               Q 205,125 190,125
               T 110,125
               Q 70,122 30,125 
               Z" />
    </clipPath>

    <!-- Clip path for emblem inside the waving flag -->
    <clipPath id="emblem-clip">
      <circle cx="120" cy="75" r="28" />
    </clipPath>
  </defs>

  <!-- FLAGPOLE ASSEMBLY -->
  <!-- Flagpole base stand (at bottom) -->
  <path d="M 10,175 L 30,175 L 25,168 L 15,168 Z" fill="url(#pole-grad)" />
  <rect x="18" y="160" width="4" height="8" fill="url(#pole-grad)" />
  
  <!-- Flagpole Shaft -->
  <rect x="18" y="12" width="4" height="150" rx="1" fill="url(#pole-grad)" />

  <!-- Flagpole Finial Ball -->
  <circle cx="20" cy="10" r="5" fill="url(#ball-grad)" stroke="#44403c" strokeWidth="0.5" />
  <rect x="17" y="14" width="6" height="2" fill="url(#pole-grad)" />

  <!-- FLAG SHADOW (Soft dropdown shadow on the background) -->
  <path d="M 32,28 Q 72,25 112,28 T 192,28 Q 207,28 212,30 L 212,130 Q 207,128 192,128 T 112,128 Q 72,125 32,128 Z" fill="#000000" opacity="0.4" filter="blur(3px)" />

  <!-- FLAG BODY (Clipped to the waving path) -->
  <g clip-path="url(#flag-clip)">
    <!-- White Background (covers the bottom-right half) -->
    <rect x="25" y="20" width="190" height="110" fill="#ffffff" />

    <!-- Red Diagonal Section (covers the top-left half) -->
    <!-- Diagonal from top-right down to bottom-left -->
    <polygon points="30,20 210,20 30,125" fill="#dc2626" />

    <!-- FLAG EMBLEM (Centered on the flag body, at coordinates 120, 75) -->
    <g transform="translate(120, 75) scale(0.65)">
      <!-- Outer Ring (Gold/Amber ornate circle) -->
      <circle cx="0" cy="0" r="43" fill="#b45309" stroke="#fbbf24" strokeWidth="1.5" />
      <circle cx="0" cy="0" r="40" fill="#ffffff" stroke="#fbbf24" strokeWidth="1" strokeDasharray="2 2" />
      
      <!-- Ring Inner White Circle -->
      <circle cx="0" cy="0" r="33" fill="#ffffff" stroke="#b45309" strokeWidth="1" />

      <!-- Centered Artwork -->
      <g transform="translate(0, -3) scale(0.55)">
        <!-- PAINT BRUSH (Slanted Left, behind the hand) -->
        <g transform="rotate(-28)">
          <path d="M -3,25 L 3,25 L 2.5,-15 L -2.5,-15 Z" fill="#b45309" />
          <path d="M -2.5,-15 L 2.5,-15 L 3,-22 L -3,-22 Z" fill="#d97706" />
          <rect x="-6.5" y="-34" width="13" height="12" rx="1" fill="#9ca3af" stroke="#4b5563" strokeWidth="0.5" />
          <line x1="-6.5" y1="-28" x2="6.5" y2="-28" stroke="#4b5563" strokeWidth="0.5" />
          <path d="M -6.5,-34 C -7.5,-48 -5,-52 0,-52 C 5,-52 7.5,-48 6.5,-34 Z" fill="#1f2937" />
          <path d="M -4.5,-46 C -4.5,-49 -2,-52 0,-52 C 2,-52 4.5,-49 4.5,-46 C 4,-43 1,-42 0,-42 C -1,-42 -4,-43 -4.5,-46 Z" fill="#dc2626" />
        </g>

        <!-- PAINT ROLLER (Slanted Right, behind the hand) -->
        <g transform="rotate(32)">
          <path d="M 0,20 L 0,-10 C 0,-18 10,-20 18,-20 L 18,-35" fill="none" stroke="#4b5563" strokeWidth="2.5" stroke-linecap="round" stroke-linejoin="round" />
          <rect x="7" y="-50" width="22" height="15" rx="2" fill="#ea580c" stroke="#1f2937" strokeWidth="1" />
          <path d="M 11,-42 Q 13,-45 15,-42 Q 17,-39 19,-42 Q 21,-45 23,-42" fill="none" stroke="#ffffff" strokeWidth="1" />
        </g>

        <!-- RAISED FIST (In front) -->
        <g transform="translate(0, 5)">
          <path d="M -11,15 L 11,15 L 9,35 L -9,35 Z" fill="#111827" />
          <path d="M -14,-10 C -15,-2 -14,15 -14,15 L 14,15 C 14,15 15,-2 14,-10 C 14,-15 10,-17 0,-17 C -10,-17 -14,-15 -14,-10 Z" fill="#111827" stroke="#000000" strokeWidth="0.5" />
          <path d="M -14,-9 C -14,-13 -10,-13 -10,-9 C -10,-5 -14,-5 -14,-9 Z" fill="#1f2937" stroke="#000000" strokeWidth="0.75" />
          <path d="M -10,-11 C -10,-15 -6,-15 -6,-11 C -6,-7 -10,-7 -10,-11 Z" fill="#1f2937" stroke="#000000" strokeWidth="0.75" />
          <path d="M -6,-12 C -6,-16 -2,-16 -2,-12 C -2,-8 -6,-8 -6,-12 Z" fill="#1f2937" stroke="#000000" strokeWidth="0.75" />
          <path d="M -2,-11 C -2,-15 2,-15 2,-11 C 2,-7 -2,-7 -2,-11 Z" fill="#1f2937" stroke="#000000" strokeWidth="0.75" />
          <path d="M 1,-6 C 4,-6 10,-10 12,-10 C 14,-10 13,-6 9,-2 C 5,2 1,1 1,-6 Z" fill="#111827" stroke="#000000" strokeWidth="0.5" />
        </g>
      </g>

      <!-- Bold acronym text: "TNPA²" -->
      <text x="0" y="24" fill="#111827" font-size="11.5" font-weight="900" font-family="'Georgia', 'Times New Roman', serif" letter-spacing="0.25" text-anchor="middle">
        TNPA²
      </text>
    </g>

    <!-- 3D WAVING GRADIENT OVERLAY (Creates the depth shadows and glossy highlights) -->
    <path d="M 30,20 
             Q 70,17 110,20 
             T 190,20 
             Q 205,20 210,22
             L 210,128
             Q 205,126 190,126
             T 110,126
             Q 70,123 30,126 
             Z" fill="url(#wave-shading)" style="mix-blend-mode: multiply;" />
  </g>
</svg>
