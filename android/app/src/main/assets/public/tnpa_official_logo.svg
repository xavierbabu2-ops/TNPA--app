<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Top arc for "தமிழ்நாடு பெயிண்டர்கள்" -->
    <path id="top-arc" d="M 60,250 A 190,190 0 0,1 440,250" fill="none" />
    <!-- Bottom arc for "ஓவியர்கள் முன்னேற்ற சங்கம்" -->
    <path id="bottom-arc" d="M 440,255 A 190,190 0 0,1 60,255" fill="none" />
  </defs>

  <!-- Outer Black Trim -->
  <circle cx="250" cy="250" r="248" fill="#000000" />

  <!-- Outer Red Ring (#E31B23) -->
  <circle cx="250" cy="250" r="245" fill="#E31B23" />

  <!-- Top Curved White Text: "தமிழ்நாடு பெயிண்டர்கள்" -->
  <text fill="#ffffff" font-size="28" font-weight="900" font-family="'Noto Sans Tamil', 'Mukta Malalar', 'Catamaran', sans-serif" letter-spacing="1.5">
    <textPath href="#top-arc" startOffset="50%" text-anchor="middle">
      தமிழ்நாடு பெயிண்டர்கள்
    </textPath>
  </text>

  <!-- Bottom Curved White Text: "ஓவியர்கள் முன்னேற்ற சங்கம்" -->
  <text fill="#ffffff" font-size="26" font-weight="900" font-family="'Noto Sans Tamil', 'Mukta Malalar', 'Catamaran', sans-serif" letter-spacing="1">
    <textPath href="#bottom-arc" startOffset="50%" text-anchor="middle">
      ஓவியர்கள் முன்னேற்ற சங்கம்
    </textPath>
  </text>

  <!-- Left Yin-Yang Symbol -->
  <g transform="translate(38, 250)">
    <circle cx="0" cy="0" r="14" fill="#000000" stroke="#E31B23" stroke-width="1.5" />
    <path d="M 0,-14 A 14,14 0 0,1 0,14 A 7,7 0 0,1 0,0 A 7,7 0 0,0 0,-14 Z" fill="#E31B23" />
    <circle cx="0" cy="-7" r="2.5" fill="#000000" />
    <circle cx="0" cy="7" r="2.5" fill="#E31B23" />
  </g>

  <!-- Right Yin-Yang Symbol -->
  <g transform="translate(462, 250)">
    <circle cx="0" cy="0" r="14" fill="#000000" stroke="#E31B23" stroke-width="1.5" />
    <path d="M 0,-14 A 14,14 0 0,1 0,14 A 7,7 0 0,1 0,0 A 7,7 0 0,0 0,-14 Z" fill="#E31B23" />
    <circle cx="0" cy="-7" r="2.5" fill="#000000" />
    <circle cx="0" cy="7" r="2.5" fill="#E31B23" />
  </g>

  <!-- Inner Black Separation Ring -->
  <circle cx="250" cy="250" r="162" fill="#000000" />

  <!-- Inner Pure White Disc -->
  <circle cx="250" cy="250" r="158" fill="#FFFFFF" />

  <!-- Central Artwork Group -->
  <g id="center-tools-and-fist" transform="translate(250, 240)">
    <!-- 1. Fine Artist Brush (Slanted Up-Left) -->
    <g transform="rotate(-36)">
      <path d="M -3,20 L 3,20 L 2,-45 L -2,-45 Z" fill="#1e293b" />
      <rect x="-3" y="-55" width="6" height="12" fill="#94a3b8" />
      <path d="M -3,-55 C -5,-70 0,-85 0,-85 C 0,-85 5,-70 3,-55 Z" fill="#0f172a" />
    </g>

    <!-- 2. Paint Roller (Slanted Right) -->
    <g transform="rotate(35) translate(25, -30)">
      <!-- Wire Frame -->
      <path d="M -15,50 L -15,0 C -15,-20 0,-25 15,-25 L 15,-50" fill="none" stroke="#334155" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Black Roller Sleeve with Rounded Ends -->
      <rect x="0" y="-72" width="38" height="28" rx="6" fill="#000000" stroke="#1e293b" stroke-width="1.5" />
      <!-- White Paint Highlights on Roller -->
      <line x1="8" y1="-64" x2="30" y2="-64" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
      <line x1="12" y1="-56" x2="26" y2="-56" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.6" />
    </g>

    <!-- 3. Wide Flat Paint Brush (Slanted Left) -->
    <g transform="rotate(-26) translate(-32, -25)">
      <!-- Brush Handle -->
      <path d="M -6,50 L 6,50 L 5,-10 L -5,-10 Z" fill="#000000" />
      <!-- Silver Ferrule Band -->
      <rect x="-14" y="-30" width="28" height="22" rx="2" fill="#cbd5e1" stroke="#475569" stroke-width="1.5" />
      <line x1="-14" y1="-22" x2="14" y2="-22" stroke="#64748b" stroke-width="1" />
      <line x1="-14" y1="-15" x2="14" y2="-15" stroke="#64748b" stroke-width="1" />
      <!-- Black Bristles with Angled Tip -->
      <path d="M -14,-30 L 14,-30 L 16,-62 L -16,-55 Z" fill="#000000" />
      <!-- Bristle Lines -->
      <line x1="-8" y1="-30" x2="-9" y2="-52" stroke="#ffffff" stroke-width="0.8" opacity="0.4" />
      <line x1="0" y1="-30" x2="0" y2="-56" stroke="#ffffff" stroke-width="0.8" opacity="0.4" />
      <line x1="8" y1="-30" x2="9" y2="-58" stroke="#ffffff" stroke-width="0.8" opacity="0.4" />
    </g>

    <!-- 4. The Strong Raised Clenched Black Fist -->
    <g id="raised-fist" transform="translate(0, 5)">
      <!-- Forearm Base -->
      <path d="M -22,25 L 22,25 L 18,70 L -18,70 Z" fill="#000000" />
      
      <!-- Forearm Muscle Highlights -->
      <path d="M -10,35 L -8,62" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
      <path d="M 6,32 L 8,55" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.7" />

      <!-- Palm / Knuckles Foundation -->
      <path d="M -28,-18 C -30,0 -28,25 -28,25 L 28,25 C 28,25 30,0 28,-18 C 28,-28 18,-32 0,-32 C -18,-32 -28,-28 -28,-18 Z" fill="#000000" />

      <!-- Folded Fingers (Pinky to Index) -->
      <!-- Pinky finger -->
      <path d="M -28,-16 C -28,-24 -20,-24 -20,-16 C -20,-8 -28,-8 -28,-16 Z" fill="#000000" stroke="#ffffff" stroke-width="1.8" />
      <!-- Ring finger -->
      <path d="M -20,-20 C -20,-28 -10,-28 -10,-20 C -10,-10 -20,-10 -20,-20 Z" fill="#000000" stroke="#ffffff" stroke-width="1.8" />
      <!-- Middle finger -->
      <path d="M -10,-23 C -10,-31 2,-31 2,-23 C 2,-12 -10,-12 -10,-23 Z" fill="#000000" stroke="#ffffff" stroke-width="1.8" />
      <!-- Index finger -->
      <path d="M 2,-21 C 2,-29 14,-29 14,-21 C 14,-11 2,-11 2,-21 Z" fill="#000000" stroke="#ffffff" stroke-width="1.8" />

      <!-- Folded Thumb clamped horizontally across -->
      <path d="M -2,-8 C 5,-10 18,-18 24,-16 C 28,-14 26,-6 18,2 C 10,8 3,6 -2,-8 Z" fill="#000000" stroke="#ffffff" stroke-width="1.8" />
    </g>
  </g>

  <!-- "TN PA²" Text Underneath the Fist -->
  <g transform="translate(250, 362)">
    <text x="0" y="0" fill="#000000" font-size="34" font-weight="900" font-family="'Arial Black', 'Impact', sans-serif" letter-spacing="2" text-anchor="middle">
      TN PA<tspan dy="-14" font-size="22">2</tspan>
    </text>
  </g>
</svg>