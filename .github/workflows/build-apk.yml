name: Build Android APK (Capacitor & TWA)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'

    - name: Set up Java JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android Build Tools
      run: |
        yes | sdkmanager --licenses || true
        sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

    - name: Install NPM Dependencies
      run: npm install

    - name: Build Web Application
      run: npm run build
      env:
        NODE_ENV: production

    - name: Initialize and Build Android Native App
      run: |
        npx cap add android || true
        npx cap sync android
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug || ./gradlew assemble
        ./gradlew assembleRelease || true
        cd ..

    - name: Prepare APK Download Package
      run: |
        mkdir -p tnpa-apk-package
        find android -name "*.apk" -exec cp {} tnpa-apk-package/ \; || true
        find android -name "*debug*.apk" -exec cp {} tnpa-apk-package/TNPA2-Android-Debug.apk \; || true
        find android -name "*release*.apk" -exec cp {} tnpa-apk-package/TNPA2-Android-Release.apk \; || true
        echo "=== Generated APK Files ==="
        ls -lh tnpa-apk-package/

    - name: Upload Android APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TNPA-Android-APK
        path: tnpa-apk-package/
        retention-days: 30
