name: Build Android APK (Capacitor & TWA)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'

    - name: Set up Java Development Kit (JDK) 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android Build Tools
      run: |
        yes | sdkmanager --licenses || true
        sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

    - name: Install NPM Dependencies
      run: npm install

    - name: Build Web Application
      run: npm run build
      env:
        NODE_ENV: production

    - name: Generate Android Signing Keystore
      run: |
        keytool -genkey -v -keystore android.keystore -alias android -keyalg RSA -keysize 2048 -validity 10000 -storepass password123 -keypass password123 -dname "CN=TNPA, OU=Developers, O=TNPA, L=Chennai, ST=Tamil Nadu, C=IN"

    - name: Initialize and Build Android Native App
      run: |
        npx cap add android || true
        npx cap sync android
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug assembleRelease
        cd ..

    - name: Sign Release APK
      run: |
        for unsigned_apk in $(find android -name "*release-unsigned.apk"); do
          echo "Signing $unsigned_apk..."
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore android.keystore -storepass password123 -keypass password123 "$unsigned_apk" android
          cp "$unsigned_apk" android/app/build/outputs/apk/release/TNPA2-Release-Signed.apk
        done

    - name: Prepare APK Download Package
      run: |
        mkdir -p tnpa-apk-package
        
        # Copy Debug APK (Ready to install on any Android phone directly)
        find android -name "*debug.apk" -exec cp {} tnpa-apk-package/TNPA2-Debug.apk \;
        
        # Copy Release APK
        find android -name "*Signed.apk" -o -name "*release*.apk" -exec cp {} tnpa-apk-package/TNPA2-Release.apk \;
        
        # Copy any AAB (Android App Bundle) for Play Store if created
        find android -name "*.aab" -exec cp {} tnpa-apk-package/TNPA2-PlayStore.aab \; || true
        
        echo "=== Package Contents ==="
        ls -la tnpa-apk-package/
        
        # Verification: Check that APK file exists
        if [ ! "$(find tnpa-apk-package -name '*.apk')" ]; then
          echo "FATAL: No APK files were generated."
          exit 1
        fi

    - name: Upload Real Android APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TNPA-Android-APK
        path: tnpa-apk-package/
        retention-days: 30
