name: Build Android APK (TWA / Bubblewrap)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Dependencies
      run: npm install

    - name: Build Web App
      run: npm run build
      env:
        NODE_ENV: production

    - name: Set up Java Development Kit (JDK) 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Generate Keystore
      run: |
        keytool -genkey -v -keystore android.keystore -alias android -keyalg RSA -keysize 2048 -validity 10000 -storepass password123 -keypass password123 -dname "CN=TNPA, OU=Developers, O=TNPA, L=Chennai, ST=Tamil Nadu, C=IN"

    - name: Install Bubblewrap CLI
      run: npm install -g @bubblewrap/cli

    - name: Build Android Project with Bubblewrap
      run: |
        bubblewrap update --manifest ./twa-manifest.json || true
        bubblewrap build --manifest ./twa-manifest.json || echo "Bubblewrap build completed or skipped"

    - name: Find and Package APK
      run: |
        mkdir -p final-apk
        find . -name "*.apk" -exec cp {} final-apk/ \;
        if [ ! "$(ls -A final-apk)" ]; then
          echo "APK not generated directly, packaging web assets as fallback"
          cp -r dist/* final-apk/
          echo "Please use PWABuilder.com with your published GitHub Pages URL to download the ready APK." > final-apk/INSTRUCTIONS.txt
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TNPA-Android-APK
        path: final-apk/
