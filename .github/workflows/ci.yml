name: TNPA² CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Test & Web Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'

    - name: Install Dependencies
      run: npm install --include=dev

    - name: Run Type Check & Linter
      run: npm run lint

    - name: Build Web Application
      run: npm run build
      env:
        NODE_ENV: production

  build-android-apk:
    name: Build Android APK
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'

    - name: Set up Java JDK 21
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android Platforms and Build Tools
      run: |
        yes | sdkmanager --licenses || true
        sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0" "platform-tools" || true
        mkdir -p android
        echo "sdk.dir=$ANDROID_HOME" > android/local.properties
        echo "android.builder.sdkDownload=true" >> android/gradle.properties

    - name: Install NPM Dependencies
      run: npm install --include=dev

    - name: Build Web Application
      run: npm run build
      env:
        NODE_ENV: production

    - name: Sync Capacitor Android
      run: |
        npx cap sync android
        sed -i "s/classpath 'com.android.tools.build:gradle:[^']*'/classpath 'com.android.tools.build:gradle:8.13.0'/g" android/build.gradle android/capacitor-cordova-android-plugins/build.gradle 2>/dev/null || true

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: wrapper
        cache-read-only: false

    - name: Build Android Native APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon --stacktrace
        ./gradlew assembleRelease --no-daemon --stacktrace || true
        cd ..

    - name: Prepare and Package APKs
      run: |
        mkdir -p tnpa-apk-package
        
        # Locate Android SDK build tools apksigner & zipalign
        BUILD_TOOLS_DIR=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -type d | sort -V | tail -n 1)
        if [ -z "$BUILD_TOOLS_DIR" ]; then
          BUILD_TOOLS_DIR=$(find /usr/local/lib/android/sdk/build-tools -maxdepth 1 -type d | sort -V | tail -n 1)
        fi
        echo "Using Android Build Tools from: $BUILD_TOOLS_DIR"
        
        # Copy Debug APK
        find android -name "*debug.apk" -exec cp {} tnpa-apk-package/TNPA2-Debug.apk \;
        
        # Sign Release APK if available
        RELEASE_RAW=$(find android -name "*release-unsigned.apk" -o -name "*release.apk" | head -n 1)
        if [ -n "$RELEASE_RAW" ] && [ -d "$BUILD_TOOLS_DIR" ]; then
          echo "Found release APK: $RELEASE_RAW"
          keytool -genkey -v -keystore tnpa.keystore -alias tnpa-key -keyalg RSA -keysize 2048 -validity 10000 -storepass tnpa123456 -keypass tnpa123456 -dname "CN=TNPA, OU=Developers, O=TNPA, L=Chennai, ST=Tamil Nadu, C=IN" || true
          "$BUILD_TOOLS_DIR/zipalign" -v -p 4 "$RELEASE_RAW" tnpa-apk-package/TNPA2-Aligned.apk || cp "$RELEASE_RAW" tnpa-apk-package/TNPA2-Aligned.apk
          "$BUILD_TOOLS_DIR/apksigner" sign --ks tnpa.keystore --ks-key-alias tnpa-key --ks-pass pass:tnpa123456 --key-pass pass:tnpa123456 --out tnpa-apk-package/TNPA2-App.apk tnpa-apk-package/TNPA2-Aligned.apk || true
          rm -f tnpa-apk-package/TNPA2-Aligned.apk
        fi
        
        # Ensure TNPA2-App.apk is always available
        if [ ! -f "tnpa-apk-package/TNPA2-App.apk" ] && [ -f "tnpa-apk-package/TNPA2-Debug.apk" ]; then
          cp tnpa-apk-package/TNPA2-Debug.apk tnpa-apk-package/TNPA2-App.apk
        fi
        
        echo "=== Ready-to-Install APK Package ==="
        ls -lh tnpa-apk-package/

    - name: Upload Android APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TNPA-Android-APK
        path: tnpa-apk-package/
        retention-days: 30
