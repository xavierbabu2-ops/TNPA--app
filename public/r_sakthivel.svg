<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="ringGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="skinGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4a373" />
      <stop offset="100%" stop-color="#ab7a52" />
    </linearGradient>
    <linearGradient id="goldChainGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.2"/>
    </filter>
  </defs>

  <circle cx="200" cy="200" r="190" fill="url(#bgGrad3)" stroke="url(#ringGrad3)" stroke-width="7" filter="url(#shadow3)"/>

  <clipPath id="circleClip3">
    <circle cx="200" cy="200" r="184" />
  </clipPath>

  <g clip-path="url(#circleClip3)">
    <!-- White shirt & shoulders -->
    <path d="M 50 400 Q 110 270 200 270 Q 290 270 350 400 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <polygon points="140,270 200,320 160,335 120,285" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <polygon points="260,270 200,320 240,335 280,285" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    
    <!-- Open collar chest & neck -->
    <polygon points="168,270 200,330 232,270" fill="#d4a373"/>
    
    <!-- Gold Chain around neck (Distinctive R. Sakthivel feature) -->
    <path d="M 165 255 Q 200 295 235 255" stroke="url(#goldChainGrad)" stroke-width="4.5" fill="none" stroke-linecap="round"/>

    <rect x="162" y="195" width="76" height="75" rx="10" fill="#ab7a52"/>

    <!-- Ears -->
    <ellipse cx="118" cy="172" rx="14" ry="24" fill="#ab7a52"/>
    <ellipse cx="282" cy="172" rx="14" ry="24" fill="#ab7a52"/>

    <!-- Face shape -->
    <ellipse cx="200" cy="168" rx="74" ry="80" fill="url(#skinGrad3)"/>

    <!-- Dark Thick Hair styled to the right (R. Sakthivel feature) -->
    <path d="M 120 145 C 112 75, 155 52, 200 52 C 245 52, 285 75, 280 145 C 270 95, 240 68, 200 68 C 160 68, 130 95, 120 145 Z" fill="#1e293b"/>
    <path d="M 122 135 C 128 80, 162 60, 205 65 C 242 60, 275 80, 278 135 C 265 98, 235 80, 200 80 C 165 80, 135 98, 122 135 Z" fill="#0f172a"/>

    <!-- Eyebrows -->
    <path d="M 138 140 Q 162 130 184 140" stroke="#0f172a" stroke-width="5.5" stroke-linecap="round" fill="none"/>
    <path d="M 216 140 Q 238 130 262 140" stroke="#0f172a" stroke-width="5.5" stroke-linecap="round" fill="none"/>

    <!-- Eyes -->
    <ellipse cx="160" cy="154" rx="11" ry="8" fill="#ffffff"/>
    <circle cx="160" cy="154" r="5.5" fill="#0f172a"/>
    <circle cx="162" cy="152" r="1.5" fill="#ffffff"/>

    <ellipse cx="240" cy="154" rx="11" ry="8" fill="#ffffff"/>
    <circle cx="240" cy="154" r="5.5" fill="#0f172a"/>
    <circle cx="242" cy="152" r="1.5" fill="#ffffff"/>

    <!-- Nose -->
    <path d="M 200 150 L 205 180 Q 200 188 195 180 Z" fill="#99633b"/>

    <!-- Dark Mustache and Beard/Stubble around chin (R. Sakthivel feature) -->
    <path d="M 148 192 Q 178 184 200 190 Q 222 184 252 192 Q 256 210 200 212 Q 144 210 148 192 Z" fill="#0f172a"/>
    <!-- Beard along jawline -->
    <path d="M 140 180 Q 135 220 160 238 Q 200 250 240 238 Q 265 220 260 180 Q 248 228 200 232 Q 152 228 140 180 Z" fill="#1e293b" opacity="0.85"/>

    <!-- Mouth / Smile line -->
    <path d="M 172 218 Q 200 226 228 218" stroke="#6b3a19" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Name & Role Badge -->
  <rect x="40" y="332" width="320" height="46" rx="23" fill="#047857" stroke="#34d399" stroke-width="3" filter="url(#shadow3)"/>
  <text x="200" y="352" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="14" letter-spacing="1">R. SAKTHIVEL</text>
  <text x="200" y="368" text-anchor="middle" fill="#a7f3d0" font-family="system-ui, sans-serif" font-weight="800" font-size="10.5" letter-spacing="0.5">STATE TREASURER | மாநில பொருளாளர்</text>
</svg>
